      { Seq: 19, 責任區: "鹽埕區", 車次: "鹽埕02", 回收日: "三,六", 停留時間: "18:35-18:45", 停留地點: "鹽埕區大義街2號(駁二藝術特區)", 行政區: "鹽埕區", 村里: "港都里", 經度: 120.2868, 緯度: 22.6188 },
      { Seq: 20, 責任區: "鹽埕隊", 車次: "鹽埕02", 回收日: "三,六", 停留時間: "18:50-19:00", 停留地點: "鹽埕區富野路85號", 行政區: "鹽埕區", 村里: "壽星里", 經度: 120.2818, 緯度: 22.6272 }
    ];

    function parseFiles(fileList) {
      let combinedParsed = [];
      let pending = fileList.length;

      Array.from(fileList).forEach(file => {
        Papa.parse(file, {
          header: true,
          dynamicTyping: true,
          skipEmptyLines: true,
          complete: function(results) {
            if (results.data && results.data.length > 0) {
              const normalized = results.data.map((row, index) => {
                // Helper to clean keys from UTF-8 BOM (\ufeff) and spaces
                const cleanKey = (k) => k ? String(k).replace(/^\ufeff/, '').trim().toLowerCase() : '';

                // Fuzzy finder for common CSV field name variations
                const getValByKeys = (candidateKeys) => {
                  for (const candidate of candidateKeys) {
                    const foundKey = Object.keys(row).find(k => cleanKey(k) === candidate.toLowerCase());
                    if (foundKey && row[foundKey] !== undefined && row[foundKey] !== null) {
                      return row[foundKey];
                    }
                  }
                  return '';
                };

                const lat = parseFloat(getValByKeys(['緯度', '緯度(wgs84)', 'lat', 'latitude', 'y'])) || 0;
                const lng = parseFloat(getValByKeys(['經度', '經度(wgs84)', 'lng', 'longitude', 'x'])) || 0;
                const spot = String(getValByKeys(['停留地點', '停留點名稱', '清運點', '地點', '地址', 'location']) || '').trim();

                return {
                  Seq: parseInt(getValByKeys(['seq', '序號', 'id'])) || (index + 1),
                  責任區: String(getValByKeys(['責任區', '隊別', '區隊']) || '').trim(),
                  車次: String(getValByKeys(['車次', '清運路線', '路線', '車號']) || '').trim(),
                  回收日: String(getValByKeys(['回收日', '回收星期', '資源回收日', '回收時間']) || '').trim(),
                  停留時間: String(getValByKeys(['停留時間', '抵達時間', '時間', '到達時間']) || '').trim(),
                  停留地點: spot,
                  行政區: String(getValByKeys(['行政區', '鄉鎮市區', 'district']) || '').trim(),
                  村里: String(getValByKeys(['村里', '里別', 'village']) || '').trim(),
                  經度: lng,
                  緯度: lat
                };
              }).filter(item => item.緯度 > 0 && item.經度 > 0 && item.停留地點 !== '');

              combinedParsed = combinedParsed.concat(normalized);
            }

            pending--;
            if (pending === 0) {
              if (combinedParsed.length > 0) {
                allData = combinedParsed;
                localStorage.setItem('kaohsiung_garbage_data', JSON.stringify(allData));
                document.getElementById('upload-btn-label').textContent = `已成功解析 ${allData.length} 筆地點數據`;
                updateVillageDropdown();
                filterData();
                showToast(`🎉 成功匯入並呈現 ${allData.length} 個垃圾清運站點！`);
              } else {
                alert('解析提示：無法找到合法的緯度與經度欄位。請確保 CSV 包含「經度」、「緯度」、「停留地點」等欄位標頭。');
              }
            }
          },
          error: function(err) {
            console.error('CSV Parsing Error:', err);
            pending--;
          }
        });
      });
    }

    function updateVillageDropdown() {
      const district = document.getElementById('district-select').value;
      const villageSelect = document.getElementById('village-select');
      const currentVal = villageSelect.value;
      
      villageSelect.innerHTML = '<option value="">全部村里</option>';
      
      const villages = new Set();
      allData.forEach(item => {
        if (!district || item.行政區 === district) {
          if (item.村里) villages.add(item.村里);
        }
      });

      Array.from(villages).sort().forEach(v => {
        const opt = document.createElement('option');
        opt.value = v;
        opt.textContent = v;
        villageSelect.appendChild(opt);
      });

      if (Array.from(villages).includes(currentVal)) {
        villageSelect.value = currentVal;
      }
    }

    function filterData() {
      const district = document.getElementById('district-select').value;
      const village = document.getElementById('village-select').value;
      const searchText = document.getElementById('search-input').value.trim().toLowerCase();

      filteredData = allData.filter(item => {
        if (district && item.行政區 !== district) return false;
        if (village && item.村里 !== village) return false;
        if (selectedDay && (!item.回收日 || !item.回收日.includes(selectedDay))) return false;
        
        if (searchText) {
          const matchLoc = item.停留地點 && item.停留地點.toLowerCase().includes(searchText);
          const matchVil = item.村里 && item.村里.toLowerCase().includes(searchText);
          const matchVeh = item.車次 && item.車次.toLowerCase().includes(searchText);
          if (!matchLoc && !matchVil && !matchVeh) return false;
        }

        return true;
      });

      render();
    }

    function render() {
      markersLayer.clearLayers();
      routePolylineLayer.clearLayers();

      const listEl = document.getElementById('site-list');
      listEl.innerHTML = '';

      // Update counter badges
      const countStr = `${filteredData.length} 筆`;
      document.getElementById('list-count-badge').textContent = `共 ${countStr}`;
      document.getElementById('mobile-count').textContent = filteredData.length;

      const emptyNotice = document.getElementById('empty-state-notice');
      if (filteredData.length === 0) {
        emptyNotice.classList.remove('hidden');
        return;
      } else {
        emptyNotice.classList.add('hidden');
      }

      const bounds = L.latLngBounds();

      // Group routes if toggled on
      const routeGroups = {};

      filteredData.forEach((item, index) => {
        const latLng = [item.緯度, item.經度];
        bounds.extend(latLng);

        // Define Color Palette per District
        const isGushan = item.行政區 === '鼓山區';
        const markerColorClass = isGushan ? 'bg-emerald-600 text-white' : 'bg-blue-600 text-white';

        // Custom Leaflet Div Icon
        const customIcon = L.divIcon({
          className: 'custom-div-icon',
          html: `
            <div class="relative group">
              <div class="w-7 h-7 rounded-full ${markerColorClass} shadow-md flex items-center justify-center font-bold text-xs border-2 border-white hover:scale-125 transition-transform">
                ${index + 1}
              </div>
            </div>
          `,
          iconSize: [28, 28],
          iconAnchor: [14, 14],
          popupAnchor: [0, -14]
        });

        // Marker Object
        const marker = L.marker(latLng, { icon: customIcon });

        // Popup Content Template
        const popupHtml = `
          <div class="p-4 w-64 text-slate-800">
            <div class="flex items-center justify-between gap-2 mb-2 pb-2 border-b border-slate-100">
              <span class="text-[11px] font-bold px-2 py-0.5 rounded ${isGushan ? 'bg-emerald-100 text-emerald-800' : 'bg-blue-100 text-blue-800'}">
                ${item.行政區} · ${item.村里 || '未標示'}
              </span>
              <span class="text-[11px] text-slate-500 font-mono">#${item.Seq}</span>
            </div>
            <h3 class="font-bold text-sm text-slate-900 mb-2 leading-snug">${item.停留地點}</h3>
            
            <div class="space-y-1.5 text-xs text-slate-600 mb-3">
              <div class="flex items-center gap-2">
                <i class="fa-regular fa-clock text-brand-600 w-4"></i>
                <span>停留時間：<strong>${item.停留時間 || '未知'}</strong></span>
              </div>
              <div class="flex items-center gap-2">
                <i class="fa-solid fa-recycle text-brand-600 w-4"></i>
                <span>回收日：<strong>${item.回收日 || '全全'}</strong></span>
              </div>
              <div class="flex items-center gap-2">
                <i class="fa-solid fa-truck text-brand-600 w-4"></i>
                <span>責任區：${item.責任區 || '預設'} / ${item.車次 || '預設'}</span>
              </div>
            </div>

            <a href="https://www.google.com/maps/dir/?api=1&destination=${item.緯度},${item.經度}" 
               target="_blank" 
               class="block text-center w-full py-1.5 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-xs font-semibold shadow-sm transition-all">
              <i class="fa-solid fa-diamond-turn-right mr-1"></i> Google 地圖導航
            </a>
          </div>
        `;

        marker.bindPopup(popupHtml);
        markersLayer.addLayer(marker);

        // Sidebar Item Elements
        const li = document.createElement('li');
        li.className = 'p-3.5 hover:bg-emerald-50/60 transition-colors cursor-pointer group';
        li.innerHTML = `
          <div class="flex items-start justify-between gap-2 mb-1">
            <div class="flex items-center gap-2">
              <span class="w-5 h-5 rounded-full ${markerColorClass} text-[10px] font-bold flex items-center justify-center flex-none">
                ${index + 1}
              </span>
              <h4 class="font-bold text-xs sm:text-sm text-slate-800 group-hover:text-brand-700 transition-colors leading-snug">
                ${item.停留地點}
              </h4>
            </div>
          </div>
          <div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-xs text-slate-500 pl-7">
            <span class="flex items-center gap-1 text-brand-700 font-medium">
              <i class="fa-regular fa-clock text-[10px]"></i> ${item.停留時間}
            </span>
            <span class="bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded text-[10px]">
              ${item.行政區} ${item.村里}
            </span>
            <span class="text-slate-400 text-[11px]">
              📅 回收: ${item.回收日}
            </span>
          </div>
        `;

        li.addEventListener('click', () => {
          map.setView(latLng, 17, { animate: true });
          marker.openPopup();
        });

        listEl.appendChild(li);

        // Group points for polylines if requested
        const vehicleKey = `${item.行政區}_${item.車次 || 'ALL'}`;
        if (!routeGroups[vehicleKey]) routeGroups[vehicleKey] = [];
        routeGroups[vehicleKey].push(latLng);
      });

      // Render polyline paths if toggled
      if (showRoutes) {
        const colors = ['#16a34a', '#2563eb', '#d97706', '#9333ea', '#0891b2', '#e11d48'];
        let colorIdx = 0;
        
        Object.keys(routeGroups).forEach(key => {
          if (routeGroups[key].length > 1) {
            const polyline = L.polyline(routeGroups[key], {
              color: colors[colorIdx % colors.length],
              weight: 4,
              opacity: 0.7,
              dashArray: '6, 8'
            });
            routePolylineLayer.addLayer(polyline);
            colorIdx++;
          }
        });
      }

      // Auto fit bounds
      if (bounds.isValid()) {
        map.fitBounds(bounds, { padding: [40, 40] });
      }
    }

    function setupEventListeners() {
      // District select change
      document.getElementById('district-select').addEventListener('change', () => {
        updateVillageDropdown();
        filterData();
      });

      // Village select change
      document.getElementById('village-select').addEventListener('change', filterData);

      // Search input change
      document.getElementById('search-input').addEventListener('input', filterData);

      // Recycling Day Filter Buttons
      document.querySelectorAll('.day-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const day = e.target.getAttribute('data-day');
          if (selectedDay === day) {
            selectedDay = "";
            e.target.classList.remove('bg-brand-600', 'text-white', 'border-brand-600');
            e.target.classList.add('text-slate-600');
          } else {
            document.querySelectorAll('.day-btn').forEach(b => {
              b.classList.remove('bg-brand-600', 'text-white', 'border-brand-600');
              b.classList.add('text-slate-600');
            });
            selectedDay = day;
            e.target.classList.add('bg-brand-600', 'text-white', 'border-brand-600');
            e.target.classList.remove('text-slate-600');
          }
          filterData();
        });
      });

      // Reset Button
      document.getElementById('reset-btn').addEventListener('click', () => {
        document.getElementById('district-select').value = '';
        updateVillageDropdown();
        document.getElementById('village-select').value = '';
        document.getElementById('search-input').value = '';
        selectedDay = '';
        document.querySelectorAll('.day-btn').forEach(b => {
          b.classList.remove('bg-brand-600', 'text-white', 'border-brand-600');
          b.classList.add('text-slate-600');
        });
        filterData();
      });

      // Toggle Polyline Routes
      document.getElementById('toggle-route-btn').addEventListener('click', () => {
        showRoutes = !showRoutes;
        document.getElementById('route-status-text').textContent = showRoutes ? '開啟' : '關閉';
        render();
      });

      // Fit bounds control
      document.getElementById('btn-fit-bounds').addEventListener('click', () => {
        if (filteredData.length > 0) {
          const bounds = L.latLngBounds(filteredData.map(i => [i.緯度, i.經度]));
          map.fitBounds(bounds, { padding: [40, 40] });
        }
      });

      // User location geolocation
      document.getElementById('btn-locate-me').addEventListener('click', () => {
        if ('geolocation' in navigator) {
          navigator.geolocation.getCurrentPosition((pos) => {
            const userLat = pos.coords.latitude;
            const userLng = pos.coords.longitude;

            if (userLocationMarker) map.removeLayer(userLocationMarker);

            userLocationMarker = L.circleMarker([userLat, userLng], {
              radius: 9,
              fillColor: '#3b82f6',
              color: '#ffffff',
              weight: 3,
              opacity: 1,
              fillOpacity: 0.9
            }).addTo(map).bindPopup('您的當前位置').openPopup();

            map.setView([userLat, userLng], 15);
          }, (err) => {
            alert('無法獲取您的位置，請檢查定位權限設定。');
          });
        } else {
          alert('您的瀏覽器不支援定位功能。');
        }
      });

      // Stats Modal Toggle
      document.getElementById('btn-show-stats').addEventListener('click', openStatsModal);
      document.getElementById('close-stats-btn').addEventListener('click', () => {
        document.getElementById('stats-modal').classList.add('hidden');
      });
    }

    function openStatsModal() {
      document.getElementById('stats-modal').classList.remove('hidden');
      
      document.getElementById('stat-total-stops').textContent = allData.length;
      
      const villages = new Set(allData.map(i => i.村里).filter(Boolean));
      document.getElementById('stat-total-villages').textContent = villages.size;

      // District Counts
      const gushanCount = allData.filter(i => i.行政區 === '鼓山區').length;
      const yanchengCount = allData.filter(i => i.行政區 === '鹽埕區').length;
      const total = allData.length || 1;

      const gushanPct = Math.round((gushanCount / total) * 100);
      const yanchengPct = Math.round((yanchengCount / total) * 100);

      document.getElementById('stat-district-bars').innerHTML = `
        <div class="space-y-1">
          <div class="flex justify-between text-xs font-semibold text-slate-600">
            <span>鼓山區 (${gushanCount} 站)</span>
            <span>${gushanPct}%</span>
          </div>
          <div class="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
            <div class="h-full bg-emerald-600" style="width: ${gushanPct}%"></div>
          </div>
        </div>
        <div class="space-y-1">
          <div class="flex justify-between text-xs font-semibold text-slate-600">
            <span>鹽埕區 (${yanchengCount} 站)</span>
            <span>${yanchengPct}%</span>
          </div>
          <div class="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
            <div class="h-full bg-blue-600" style="width: ${yanchengPct}%"></div>
          </div>
        </div>
      `;

      // Vehicle counts
      const vehicleMap = {};
      allData.forEach(i => {
        const v = i.車次 || '一般路線';
        vehicleMap[v] = (vehicleMap[v] || 0) + 1;
      });

      document.getElementById('stat-vehicle-list').innerHTML = Object.entries(vehicleMap)
        .map(([veh, count]) => `
          <div class="flex items-center justify-between p-2 bg-slate-50 rounded-lg border border-slate-100 text-xs">
            <span class="font-bold text-slate-700">${veh}</span>
            <span class="text-slate-500">${count} 個停靠點</span>
          </div>
        `).join('');
    }

    // Floating Notification Helper
    function showToast(msg) {
      const toast = document.createElement('div');
      toast.className = 'fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs px-4 py-2.5 rounded-xl shadow-xl z-50 animate-bounce';
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }

    window.addEventListener('DOMContentLoaded', () => {
      initMap();
      setupCSVUploader();
      setupEventListeners();
      loadInitialData();
    });
  </script>
